<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Demo mezcla</title>
  <link rel="stylesheet" href="comun/fuentes.css">
  <script src="comun/vendor/gsap.min.js"></script>
  <script src="comun/mg.js"></script>
</head>
<body>
  <!-- Demo del UNIVERSO mezclable: la misma escena (18 pulsos) con cualquier estilo, variante o mezcla. Lo único que
       cambia entre renders son los ajustes del estilo (paleta, tipografía, ritmo, curvas, muelle, luz).
       Variables: { "estilo": "oscuro" | "claro" | "agencia" | "claro-lima" | …, "ajustes": { …tokens } , "sonido": {…} }.
       La escena dura 18 pulsos del bpm del estilo (oscuro 9 s, claro 10 s, agencia 8,43 s, claro-lima 8,72 s): el HTML
       declara la más larga (10 s) y cada variante se corta con --hasta (ver variantes/mezcla-*.json). Marca ficticia «pulso». -->
  <div id="mezcla" data-composition-id="mezcla" data-start="0" data-duration="10" data-width="1920" data-height="1080" data-fps="60" style="width:1920px;height:1080px"></div>
  <!-- sonido de la variante oscuro (120 BPM, p = 0,5 s); las demás lo traen en su "sonido" (los tiempos van en pulsos,
       redondeados al fotograma como el Sequence de Remotion) -->
  <script type="application/json" id="mg-sonido">
    { "volumen": 0.7, "sfx": [
      { "t": 0.1833, "n": "tic", "vol": 0.3 }, { "t": 0.5, "n": "pop", "vol": 0.4 }, { "t": 1.5, "n": "whoosh-suave", "vol": 0.3 }, { "t": 2.0, "n": "impacto", "vol": 0.45 },
      { "t": 3.5, "n": "pop", "vol": 0.3 }, { "t": 6.0, "n": "whoosh-rapido", "vol": 0.4 }, { "t": 6.25, "n": "impacto", "vol": 0.4 }, { "t": 6.75, "n": "impacto", "vol": 0.4 },
      { "t": 7.25, "n": "impacto", "vol": 0.4 }, { "t": 7.8, "n": "impacto", "vol": 0.55 } ] }
  </script>
  <script>
    const { h, F, capa, Forma, Onda, Tarjeta, Progreso, Contador, Mascara, Golpe, PorLetra, Flash, FondoEstilo, Camara2D, tramo, curva, muelleEstilo, golpeEstilo: g, mezclar, ESTILOS } = MG;

    // Variante: estilo + ajustes (mismo contrato que las props de DemoMezcla en Remotion).
    const VAR = MG.variables({ estilo: "oscuro", ajustes: {} });
    const E = mezclar(ESTILOS[VAR.estilo] || ESTILOS.oscuro, VAR.ajustes || {});
    const P = 60 / ((E.ritmo || {}).bpm || 120); // un pulso en segundos
    const DURACION = 18 * P;                      // lo que dura la variante (el resto, hasta 10 s, queda en el último cuadro)

    // AbsoluteFill de Remotion = capa flex en columna.
    const lleno = (style, ...kids) => capa({ display: "flex", flexDirection: "column", ...style }, ...kids);

    const escena0 = (t) => {
      const est = E, ent = curva("entrada");
      const aterriza = muelleEstilo(t, g(4)); // tarjeta: rebote SOLO si el estilo lo permite, con sobrepaso limitado
      const sale = tramo(t, g(12), g(12) + 0.25, curva("salida"));
      const tit = { fontFamily: est.fuente, fontWeight: est.peso, letterSpacing: est.tracking, color: est.texto, textTransform: est.mayusculas ? "uppercase" : undefined };
      const color2 = (est.paleta && est.paleta[1]) || est.acento;
      const titT = { fontFamily: est.fuente, fontWeight: est.peso, letterSpacing: est.tracking, textTransform: est.mayusculas ? "uppercase" : undefined, color: est.textoTarjeta || est.texto };
      return F(
        // 1 · punto de luz → píldora → tarjeta (objeto puente)
        Forma(t, { fondo: (tt) => (tt < g(2) ? est.acento : est.tarjeta), colorLuz: est.acento, claves: [
          { t: 0.05, x: 960, y: 300, w: 28, h: 28, r: 14, luz: 1.4, o: 0 }, { t: 0.2, x: 960, y: 520, w: 28, h: 28, o: 1 },
          { t: g(1), x: 960, y: 540, w: 300, h: 70, r: 35, luz: 0.8 }, { t: g(2), x: 960, y: 540, w: 300, h: 70, luz: 0.4 },
          { t: g(3), x: 960, y: 540, w: 40, h: 40, r: 20, luz: 1.4 }, { t: g(3) + 0.08, x: 960, y: 540, w: 40, h: 40, o: 0 }] },
          t > g(1) && t < g(2.8) ? h("div", { style: { display: "flex", alignItems: "center", justifyContent: "center", height: "100%", fontFamily: est.fuenteTexto, fontWeight: 600, fontSize: 28, color: est.fondo, opacity: tramo(t, g(1), g(1) + 0.15) } }, "Nuevo") : null),
        t > g(1) && t < g(1.9) ? Onda(t, { t0: g(1), x: 960, y: 540, w: 300, h: 70, radio: 35, color: est.acento }) : null,
        // 2 · tarjeta con contador y anillo (misma curva)
        t > g(3) && t < g(12) + 0.3 ? lleno({ alignItems: "center", justifyContent: "center" },
          h("div", { style: { transform: `scale(${(0.6 + 0.4 * aterriza) * 1.25}) translateY(${-200 * sale}px)`, opacity: Math.min(1, aterriza * 3) * (1 - sale) } },
            Tarjeta({ ancho: 980, alto: 360, padding: 44 },
              h("div", { style: { display: "flex", gap: 40, alignItems: "center", height: "100%" } },
                h("div", { style: { position: "relative", width: 200, height: 200 } },
                  Progreso(t, { t0: g(4.5), dur: g(4) - g(0), ancho: 200, alto: 200, color: est.acento, grosor: 10, hasta: 0.86 }),
                  h("div", { style: { position: "absolute", left: 0, top: 0, right: 0, bottom: 0, display: "flex", alignItems: "center", justifyContent: "center", ...titT, fontSize: 52 } }, Contador(t, { hasta: 86, t0: g(4.5), dur: g(4), sufijo: "%" }))),
                h("div", {},
                  h("div", { style: { fontFamily: est.fuenteTexto, fontSize: 30, color: est.textoTarjeta || est.suave, opacity: est.textoTarjeta ? 0.6 : 1 } }, "Usuarios activos"),
                  h("div", { style: { ...titT, fontSize: 92, lineHeight: 1 } }, Contador(t, { hasta: 1284, t0: g(5), dur: g(4) })),
                  h("div", { style: { fontFamily: est.fuenteTexto, fontSize: 28, color: color2, marginTop: 8, opacity: tramo(t, g(7), g(7) + 0.2, ent), transform: `scale(${0.8 + 0.2 * tramo(t, g(7), g(7) + 0.25, ent)})`, transformOrigin: "left" } }, "+18 % esta semana")),
                h("div", { style: { display: "flex", alignItems: "flex-end", gap: 10, height: 200, marginLeft: "auto" } },
                  [0.45, 0.7, 0.55, 0.85, 1].map((alto, i) => {
                    const k = tramo(t, g(6 + i), g(6 + i) + 0.3, ent);
                    return h("div", { style: { width: 26, height: 200 * alto * k, borderRadius: 8, background: i === 4 ? est.acento : est.textoTarjeta || est.suave, opacity: i === 4 ? 1 : 0.5, boxShadow: i === 4 && k > 0.9 ? `0 0 24px ${est.acento}` : undefined } });
                  })))))) : null,
        // titular por máscara con la curva y la duración de entrada del estilo
        h("div", { style: { position: "absolute", left: 120, top: 110, ...tit, fontSize: 84, opacity: 1 - sale } },
          t > g(4) ? Mascara(t, { texto: "Tus datos, en vivo.", t0: g(4), acento: ["vivo."] }) : null),
        // 3 · palabras al pulso y marca
        lleno({ alignItems: "center", justifyContent: "center", ...tit, fontSize: 180 },
          ["Claro.", "Rápido.", "Tuyo."].map((w, i) => h("div", { key: w, style: { position: "absolute", transform: `scale(${1 + 0.14 * Math.max(0, Math.min(1, (t - g(12.5 + i)) / (g(13.4 + i) - g(12.5 + i))))})` } },
            Golpe(t, { texto: w, t0: g(12.5 + i), t1: g(13.4 + i) })))),
        t > g(15.6) ? lleno({ alignItems: "center", justifyContent: "center" },
          h("div", { style: { display: "flex", alignItems: "center", gap: 26 } },
            h("div", { style: { width: 96, height: 96, borderRadius: 48, border: `14px solid ${est.acento}`, boxSizing: "border-box", transform: `scale(${tramo(t, g(15.6), g(15.6) + 0.3, ent)})` } }),
            h("div", { style: { ...tit, fontSize: 140 } }, PorLetra(t, { texto: "pulso", t0: g(15.8), escalon: 0.035, dur: 0.25 })))) : null,
        Flash(t, { t0: g(15.6), dur: 0.25, color: est.acento, fuerza: 0.35 }));
    };

    const CAM = [
      { t: 0, x: 960, y: 540, s: 1.08 }, { t: 4 * P, x: 960, y: 540, s: 1.0 }, { t: 6 * P, x: 1010, y: 560, s: 1.12, rz: -1 }, { t: 8 * P, x: 1060, y: 590, s: 1.28 },
      { t: 9 * P, x: 960, y: 540, s: 1.05 }, { t: 11 * P, x: 900, y: 520, s: 1.18, rz: 1 }, { t: 12 * P, x: 960, y: 540, s: 1.0 }, { t: 13 * P, x: 930, y: 530, s: 1.08, rz: -1 }, { t: 14 * P, x: 990, y: 550, s: 1.02, rz: 1 },
      { t: 15 * P, x: 940, y: 535, s: 1.1, rz: -0.5 }, { t: 15.6 * P, x: 960, y: 540, s: 0.96 }, { t: 18 * P, x: 975, y: 545, s: 1.2 }];

    // Pasada la duración de la variante se congela el último fotograma (el render se corta antes con --hasta).
    const escena = (t0) => { const t = Math.min(t0, DURACION - 1 / 60); return capa({}, FondoEstilo(t), Camara2D(t, { claves: CAM }, escena0(t))); };

    MG.montar({ id: "mezcla", duracion: 10, fps: 60, estilo: E, escena, fuentes: [E.fuente, E.fuenteTexto] });
  </script>
</body>
</html>
