<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Demo agencia</title>
  <link rel="stylesheet" href="comun/fuentes.css">
  <script src="comun/vendor/gsap.min.js"></script>
  <script src="comun/mg.js"></script>
  <!-- el render de Remotion mide las cajas en border-box (medido: la tarjeta «móvil · 390» mide 300 px, no 300 + padding) -->
  <style>#agencia *, #agencia *::before, #agencia *::after { box-sizing: border-box; }</style>
</head>
<body>
  <!-- Demo de la dirección AGENCIA. 11,25 s, 60 fps, 128 BPM: una sección por compás (1,875 s), cada una con su color
       plano; las transiciones las hace un objeto (láser, móvil, punto), nunca un fundido. Estudio ficticio «norte». -->
  <div id="agencia" data-composition-id="agencia" data-start="0" data-duration="11.25" data-width="1920" data-height="1080" data-fps="60" style="width:1920px;height:1080px"></div>
  <!-- tiempos de los efectos redondeados al fotograma (como la Sequence del original) -->
  <script type="application/json" id="mg-sonido">
    { "musica": "musica/musica-agencia.wav", "volumenMusica": 0.55, "fundido": 0, "volumen": 0.7, "sfx": [
      { "t": 0, "n": "whoosh-suave", "vol": 0.35 }, { "t": 1.55, "n": "subida", "vol": 0.3 }, { "t": 1.8833, "n": "impacto", "vol": 0.55 }, { "t": 2.0167, "n": "pop", "vol": 0.3 },
      { "t": 3.3333, "n": "whoosh-rapido", "vol": 0.4 }, { "t": 3.75, "n": "whoosh", "vol": 0.45 },
      { "t": 4.25, "n": "click", "vol": 0.3 }, { "t": 4.3667, "n": "click", "vol": 0.3 }, { "t": 4.4833, "n": "click", "vol": 0.3 },
      { "t": 5.3833, "n": "whoosh-rapido", "vol": 0.5 }, { "t": 5.6333, "n": "impacto", "vol": 0.5 },
      { "t": 6.1, "n": "tic", "vol": 0.35 }, { "t": 6.5667, "n": "tic", "vol": 0.35 }, { "t": 7.0333, "n": "tic", "vol": 0.35 },
      { "t": 7.5, "n": "click", "vol": 0.5 },
      { "t": 7.75, "n": "tic", "vol": 0.2 }, { "t": 7.8167, "n": "tic", "vol": 0.2 }, { "t": 7.8833, "n": "tic", "vol": 0.2 }, { "t": 7.9667, "n": "tic", "vol": 0.2 }, { "t": 8.0333, "n": "tic", "vol": 0.2 }, { "t": 8.1, "n": "tic", "vol": 0.2 },
      { "t": 8.5, "n": "impacto", "vol": 0.5 },
      { "t": 9.4, "n": "impacto", "vol": 0.5 }, { "t": 9.85, "n": "impacto", "vol": 0.5 }, { "t": 10.3167, "n": "impacto", "vol": 0.75 } ] }
  </script>
  <script>
    const { h, F, capa, Movil, Forma, Lineas, Descifra, PorLetra, Golpe, Onda, Flash, BarridoRadial, ZoomAtraves, muelle, tramo, CURVAS, interp, ESTILOS, COLORES_AGENCIA: C, FUENTES } = MG;
    const { SYNE, SERIF, MONO } = FUENTES;
    const E = ESTILOS.agencia;
    const COMPAS = 1.875, T = COMPAS / 4; // 0,469 s por tiempo
    const S = (n) => n * COMPAS;
    const lerp = (k, a, b) => a + (b - a) * k; // interpolate() de Remotion sin recorte (extiende)
    // AbsoluteFill de Remotion: capa en flex columna (lo que va dentro sin left/top se centra igual que en el original)
    const fill = (style, ...kids) => capa({ display: "flex", flexDirection: "column", ...style }, ...kids);

    // ── helpers que replican el azar de Remotion (random(): hashCode + mulberry32) para que Glitch y Chispas salgan idénticos
    const rnd = MG.azar; // = random() de Remotion (misma fórmula y semillas)
    const Glitch = (t, { t0, dur = 0.2 }, kids) => {
      if (t < t0 || t > t0 + dur) return fill({}, kids(t));
      const g = Math.floor(((t - t0) * 60) / 2), r = (k) => rnd(`gl-${g}-${k}`);
      return fill({},
        fill({ transform: `translateX(${(r(1) - 0.5) * 30}px)`, mixBlendMode: "screen", filter: "sepia(1) saturate(8) hue-rotate(-50deg)", opacity: 0.7 }, kids(t)),
        fill({ transform: `translateX(${(r(2) - 0.5) * -30}px)`, mixBlendMode: "screen", filter: "sepia(1) saturate(8) hue-rotate(140deg)", opacity: 0.7 }, kids(t)),
        ...Array.from({ length: 7 }, (_, i) => { const y0 = r(10 + i) * 95, hh = 1 + r(20 + i) * 4; return fill({ clipPath: `inset(${y0}% 0 ${100 - y0 - hh}% 0)`, transform: `translateX(${(r(30 + i) - 0.5) * 240}px)` }, kids(t)); }));
    };
    const Chispas = (t, { t0, x = 960, y = 540, n = 60, colores }) => {
      if (t < t0 || t > t0 + 1.5) return null;
      const f = (t - t0) * 60;
      return fill({ pointerEvents: "none" }, Array.from({ length: n }, (_, i) => {
        const ang = rnd(`ch-a${i}`) * Math.PI * 2, v = 15 + rnd(`ch-v${i}`) * 12, d = v * 14 * (1 - Math.exp(-f / 14)), L = 20 + rnd(`ch-l${i}`) * 20;
        return h("div", { style: { position: "absolute", left: x + Math.cos(ang) * d, top: y + Math.sin(ang) * d, width: L, height: 4, borderRadius: 2, background: colores[i % colores.length], transform: `rotate(${ang}rad)`, opacity: interp(f, [0, 60, 90], [1, 1, 0]) } });
      }));
    };
    // useTimecode() de las capas de Remotion: 00:00:SS:FF a 30 fps (MG.timecode es otro formato)
    const timecode30 = (t) => { const s = Math.floor(t), f = Math.floor((t - s) * 30); return `00:00:${String(s).padStart(2, "0")}:${String(f).padStart(2, "0")}`; };

    /** Cilindro tipográfico: anillos de texto girando (relleno crema con extrusión, contorno, serif cursiva lima). */
    const Cilindro = (t) => {
      const entra = tramo(t, 0, 0.6), cae = tramo(t, 1.5, 1.77, CURVAS.acelera), giro = t * 40 + cae * 160;
      const anillo = (texto, y, estilo, signo, extru = false) => {
        const chars = Array.from(texto.repeat(2)), paso = 360 / chars.length;
        return h("div", { style: { position: "absolute", left: 0, top: y, transformStyle: "preserve-3d", transform: `rotateY(${signo * giro}deg)` } },
          chars.map((ch, i) => h("span", { style: { position: "absolute", left: 0, top: 0, transform: `rotateY(${i * paso}deg) translateZ(560px) translate(-50%, -50%)`, whiteSpace: "pre", fontFamily: SYNE, fontWeight: 800, fontSize: 96, lineHeight: 1, ...estilo,
            textShadow: extru ? "0 2px 0 #6b6658, 0 4px 0 #57534a, 0 6px 0 #45413a, 0 8px 0 #2a2822" : undefined } }, ch)));
      };
      return fill({ perspective: "1400px", opacity: 1 - tramo(t, 1.7, 1.78) },
        h("div", { style: { position: "absolute", left: 960, top: 540, transformStyle: "preserve-3d", transform: `rotateX(${-18 - 70 * cae}deg) rotateZ(-5deg) scale(${lerp(entra, 3, 1)})` } },
          anillo("DISEÑO WEB · ", -240, { color: C.crema }, 1, true),
          anillo("BRANDING · ", -120, { color: "transparent", webkitTextStroke: `2px ${C.crema}` }, -1),
          anillo("desarrollo · ", 0, { fontFamily: SERIF, fontWeight: 400, fontStyle: "italic", color: C.lima, fontSize: 110 }, 1),
          anillo("MOTION · ", 120, { color: C.crema }, -1, true),
          anillo("PRODUCTO · ", 240, { color: "transparent", webkitTextStroke: `2px ${C.crema}` }, 1)));
    };

    /** Navegador crema → móvil (muelle con sobrepaso ~35 %, giro en Y que va y vuelve). Objeto puente S1→S2. */
    const Navegador = (t) => {
      if (t < S(1) || t > S(3)) return null;
      const p = tramo(t, S(1) + 0.02, S(1) + 0.39);
      const m = muelle(t, S(1) + 1.45, { stiffness: 340, damping: 12, mass: 1 }); // spring() de Remotion, sin recorte
      const W = lerp(m, 820, 420), H = lerp(m, 560, 760), ry = Math.sin(Math.min(m, 1) * Math.PI) * 30, x = lerp(m, 1460, 1420);
      const pantalla = tramo(t, S(2), S(2) + 0.14);
      return h("div", { style: { position: "absolute", left: x - W / 2, top: 560 - H / 2 + (1 - p) * 300, width: W, height: H, borderRadius: lerp(Math.min(m, 1), 14, 48), background: C.crema, overflow: "hidden",
        transform: `perspective(1600px) rotateX(${(1 - p) * 28 + 4}deg) rotateY(${-ry - 14 + 6 * Math.sin(t * 1.3)}deg) scale(${0.6 + 0.4 * p})`, transformOrigin: "50% 100%", boxShadow: "0 40px 80px rgba(0,0,0,0.35)", filter: p < 0.33 ? `blur(${(1 - p * 3) * 8}px)` : undefined } },
        h("div", { style: { height: 40, background: "#E4DED0", display: "flex", alignItems: "center", gap: 10, padding: "0 16px" } }, ["#E8302A", "#F5B400", "#22C55E"].map((c) => h("div", { style: { width: 12, height: 12, borderRadius: 6, background: c } }))),
        h("div", { style: { padding: 30, transform: `translateY(${-40 * pantalla}%)`, filter: pantalla > 0 && pantalla < 1 ? "blur(6px)" : undefined } },
          h("div", { style: { fontFamily: SYNE, fontWeight: 800, fontSize: 54, color: C.negro, lineHeight: 1 } }, "NUEVA WEB"),
          [0, 1, 2].map((i) => h("div", { style: { height: 70, marginTop: 22, borderRadius: 12, background: i === 1 ? C.lima : "#D9D2C2" } })),
          // casilla con el punto negro por la que entra el zoom (S2→S3)
          h("div", { style: { marginTop: 22, height: 110, borderRadius: 12, background: "#D9D2C2", display: "flex", alignItems: "center", justifyContent: "center" } }, h("div", { style: { width: 30, height: 30, borderRadius: 15, background: C.negro } }))));
    };

    const Titulo = (t, { n, lineas, cursiva, color = C.crema, tam = 132, extra = 0 }) => {
      const t0 = S(n) + 0.12, t1 = S(n + 1) - 0.14 + extra;
      if (t < S(n) || t > S(n + 1) + extra) return null;
      return h("div", { style: { position: "absolute", left: 120, top: 250 } },
        h("div", { style: { fontFamily: MONO, fontSize: 24, color, opacity: 0.8, letterSpacing: "0.08em", transform: `scaleX(${tramo(t, t0, t0 + 0.09)})`, transformOrigin: "left", border: `1.5px solid ${color}`, borderRadius: 30, padding: "6px 16px", display: "inline-block" } }, `0${n} / 05`),
        Lineas(t, { lineas, t0: t0 + 0.05, t1, escalon: 0.05, dur: 0.16, style: { marginTop: 22, fontFamily: SYNE, fontWeight: 800, fontSize: tam, lineHeight: 0.95, color, textTransform: "uppercase", letterSpacing: "-0.03em" } }),
        cursiva ? Lineas(t, { lineas: [cursiva], t0: t0 + 0.1, t1, dur: 0.16, style: { fontFamily: SERIF, fontStyle: "italic", fontSize: 104, color: C.lima, lineHeight: 1.05 } }) : null);
    };

    /** HUD propio de la demo (esquinas de 22 px a 46 px del borde, rótulos de 18 px y barra de secciones). */
    const Hud = (t) => {
      if (t < S(1) + 0.05) return null;
      const sec = Math.min(4, Math.floor(t / COMPAS)), prog = (t % COMPAS) / COMPAS, col = "rgba(242,237,226,0.7)", m = 46, L = 22;
      const esq = (s) => h("div", { style: { position: "absolute", width: L, height: L, borderStyle: "solid", borderColor: col, borderWidth: 0, ...s } });
      return fill({ fontFamily: MONO, fontSize: 18, color: col, letterSpacing: "0.1em", pointerEvents: "none" },
        esq({ left: m, top: m, borderLeftWidth: 2, borderTopWidth: 2 }), esq({ right: m, top: m, borderRightWidth: 2, borderTopWidth: 2 }),
        esq({ left: m, bottom: m, borderLeftWidth: 2, borderBottomWidth: 2 }), esq({ right: m, bottom: m, borderRightWidth: 2, borderBottomWidth: 2 }),
        h("div", { style: { position: "absolute", left: m + 40, top: m - 4 } }, "NORTE STUDIO · REEL 2026"),
        h("div", { style: { position: "absolute", right: m + 40, top: m - 4 } }, timecode30(t)),
        h("div", { style: { position: "absolute", right: m + 40, bottom: m - 4, display: "flex", gap: 6 } },
          [0, 1, 2, 3, 4].map((i) => h("div", { style: { width: 46, height: 4, background: "rgba(242,237,226,0.25)", overflow: "hidden" } },
            h("div", { style: { height: "100%", width: i < sec ? "100%" : i === sec ? `${prog * 100}%` : 0, background: C.lima } })))));
    };

    /** Fondo plano por sección; S1→S2 lo cambia un barrido radial desde el móvil. */
    const Fondo = (t) => {
      const base = t < S(1) ? C.negro : t < S(2) ? C.azul : t < S(3) ? C.rojo : t < S(4) ? C.negro : t < S(5) ? C.morado : C.negro;
      return fill({ background: t < S(2) ? base : t < S(3) ? C.azul : base },
        t >= S(2) && t < S(3) ? BarridoRadial(t, { t0: S(2), dur: 0.14, x: 1420, y: 560, color: C.rojo, borde: "#FF3E8A" }) : null,
        t >= S(4) && t < S(5) ? capa({ background: `radial-gradient(ellipse 60% 60% at 50% 50%, ${C.moradoLuz}, transparent 70%)` }) : null);
    };

    /** S3: el punto negro de la casilla llega centrado y se desliza a su sitio; luego cambia de forma en cada tiempo. */
    const Formas = (t) => {
      if (t < S(3) || t > S(4) + 0.2) return null;
      const k = (n) => S(3) + n * T;
      return Forma(t, { fondo: (tt) => (tt < k(1) ? C.lima : tt < k(2) ? C.crema : C.lima), colorLuz: C.lima, claves: [
        { t: S(3), x: 960, y: 540, w: 300, h: 300, r: 150, rz: 0, luz: 0.2 }, { t: S(3) + 0.2, x: 1360, y: 560, w: 300, h: 300, r: 150, rz: 0, luz: 0.4 },
        { t: k(1), x: 1360, y: 560, w: 300, h: 300, r: 150, rz: 0 }, { t: k(1) + 0.13, w: 280, h: 280, r: 30, rz: 45 },
        { t: k(2), w: 280, h: 280, r: 30, rz: 45 }, { t: k(2) + 0.13, w: 460, h: 160, r: 80, rz: 90 },
        { t: k(3), w: 460, h: 160, r: 80, rz: 90 }, { t: k(3) + 0.13, w: 300, h: 300, r: 150, rz: 180 }, { t: S(4), x: 1380, y: 560, w: 300, h: 300, rz: 190 }] });
    };

    const Cierre = (t) => {
      if (t < S(5)) return null;
      const golpe = S(5) + 0.9375 + 0.0025; // 10,3125 s: en la rejilla, tras 2 fotogramas de silencio
      const sub = tramo(t, golpe + 0.25, golpe + 0.45);
      return F(
        fill({ alignItems: "center", justifyContent: "center", fontFamily: SYNE, fontWeight: 800, fontSize: 300, color: C.crema, letterSpacing: "-0.04em" },
          h("div", { style: { position: "absolute" } }, Golpe(t, { texto: "TODO", t0: S(5) + 0.02, t1: S(5) + T - 0.02, desde: 1.4 })),
          h("div", { style: { position: "absolute", color: C.lima } }, Golpe(t, { texto: "EN UNO", t0: S(5) + T, t1: golpe - 0.08, desde: 1.4 }))),
        t > golpe ? fill({ alignItems: "center", justifyContent: "center" },
          h("div", { style: { fontFamily: SYNE, fontWeight: 800, fontSize: 170, color: C.crema, letterSpacing: "-0.03em" } }, PorLetra(t, { texto: "NORTE", t0: golpe + 0.05, escalon: 0.033, dur: 0.14, desde: { y: 1, s: 1, blur: 0 } })),
          h("div", { style: { width: 520 * sub, height: 6, background: C.lima, marginTop: 12, boxShadow: `0 0 20px ${C.lima}` } }),
          h("div", { style: { fontFamily: SERIF, fontStyle: "italic", fontSize: 64, color: C.lima, marginTop: 14, opacity: sub } }, "estudio de diseño")) : null,
        Onda(t, { t0: golpe, w: 80, crece: 30, dur: 0.3, color: "rgba(240,240,240,0.6)", grosor: 8 }),
        Onda(t, { t0: golpe + 0.05, w: 80, crece: 30, dur: 0.3, color: "rgba(240,240,240,0.5)", grosor: 8 }),
        Chispas(t, { t0: golpe, colores: [C.lima, C.azul, C.rojo, C.crema], n: 70 }));
    };

    const contenido = (t) => fill({},
      t < S(1) ? Cilindro(t) : null,
      // línea láser lima que nace al plegarse el cilindro
      t > 1.62 && t < S(1) + 0.2 ? h("div", { style: { position: "absolute", left: 960 - 900 * tramo(t, 1.62, 1.75), top: 538, width: 1800 * tramo(t, 1.62, 1.75), height: 4, background: C.lima, boxShadow: `0 0 12px ${C.lima}, 0 0 40px ${C.lima}`, opacity: 1 - tramo(t, S(1), S(1) + 0.15) } }) : null,
      Titulo(t, { n: 1, lineas: ["Diseño"], cursiva: "& desarrollo web", tam: 116 }),
      Titulo(t, { n: 2, lineas: ["Responsive"], cursiva: "en cada pantalla", tam: 94 }),
      t >= S(2) + 0.45 && t < S(3) ? [0, 1, 2].map((i) => Movil(t, { key: "movil" + i, estela: 0.4, claves: [{ t: S(2) + 0.45 + i * 0.12, x: 2300, y: 330 + i * 150, o: 1, rz: 8, ry: -40 }, { t: S(2) + 0.82 + i * 0.12, x: 860 + i * 70, y: 640 + i * 110, rz: -3, ry: -18 }, { t: S(3), x: 840 + i * 70, y: 630 + i * 110, rz: -3, ry: -14 }] },
        h("div", { style: { width: 300, height: 90, borderRadius: 16, background: [C.crema, C.lima, C.negro][i], color: i === 2 ? C.crema : C.negro, fontFamily: MONO, fontSize: 24, display: "flex", alignItems: "center", padding: "0 24px", boxShadow: "0 20px 40px rgba(0,0,0,0.3)" } }, ["móvil · 390", "tablet · 820", "escritorio · 1440"][i]))) : null,
      ZoomAtraves(t, { t0: S(3) - 0.25, t1: S(3), ox: 1420, oy: 657, hasta: 14 }, Navegador(t)),
      Titulo(t, { n: 3, lineas: ["Sistemas"], cursiva: "& automatización", extra: 0.2 }),
      Formas(t),
      t >= S(4) && t < S(5) ? h("div", { style: { position: "absolute", left: 120, top: 330, fontFamily: SYNE, fontWeight: 800, fontSize: 120, color: C.crema, textTransform: "uppercase" } },
        h("div", { style: { background: "linear-gradient(90deg,#5EE6D0,#B48CFF)", webkitBackgroundClip: "text", color: t < S(4) + 0.75 ? "transparent" : C.crema } }, Descifra(t, { texto: "EXPERTOS EN", t0: S(4) + 0.22, dur: 0.55 })),
        h("div", { style: { fontSize: 280, color: C.lima, lineHeight: 1, marginTop: 10 } }, Golpe(t, { texto: "IA.", t0: S(4) + 1.0, t1: S(5) - 0.08, desde: 1.4 }))) : null,
      Cierre(t));

    const escena = (t) => {
      // deriva continua dentro de cada sección (≈36 px/s y +2,4 %/s): nunca un fotograma quieto
      const ts = t % COMPAS;
      return fill({},
        Fondo(t),
        fill({ transform: `translate(${-0.6 * ts * 60 * 0.5}px, ${-0.2 * ts * 60 * 0.5}px) scale(${1 + ts * 0.024})` }, Glitch(t, { t0: S(4), dur: 0.2 }, contenido)),
        Hud(t),
        Flash(t, { t0: S(1), dur: 0.17, color: "#FFFFFF", fuerza: 0.85 }),
        t > S(1) && t < S(1) + 0.17 ? capa({ background: "radial-gradient(ellipse 60% 6% at 50% 50%, #7fe8ff, transparent)", transform: `scaleX(${0.5 + 1.5 * tramo(t, S(1), S(1) + 0.17)})`, opacity: 1 - tramo(t, S(1), S(1) + 0.17) }) : null,
        Flash(t, { t0: S(5) + 0.9375, dur: 0.27, fuerza: 0.9 }));
    };

    MG.montar({ id: "agencia", duracion: 11.25, fps: 60, estilo: E, escena, fuentes: [SYNE, SERIF, MONO] });
  </script>
</body>
</html>
